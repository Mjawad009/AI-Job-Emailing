<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics — Outreach Mailer</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">Outreach Mailer</div>
    <nav>
      <a href="/">Compose</a>
      <a href="/bulk.html">Bulk Send</a>
      <a href="/sequences.html">Sequences</a>
      <a href="/agent.html">Assistant</a>
      <a href="/logs.html">Logs</a>
      <a href="/settings.html">Settings</a>
      <a href="#" id="logoutLink">Log out</a>
    </nav>
  </header>

  <h1>Analytics</h1>
  <p class="sub">Opens and clicks come from tracking pixels/links; bounces are best-effort (see Settings for details).</p>

  <div class="stats-grid" id="statsGrid"></div>
  <div class="stats-grid" id="rateGrid" style="margin-top:-8px;"></div>

  <div class="panel" id="batchesPanel" style="display:none;">
    <div class="section-title">Campaigns</div>
    <div id="batchesWrap"></div>
  </div>

  <div class="panel">
    <div class="row" style="align-items:flex-end;">
      <div class="field" style="margin-bottom:0;">
        <label for="search">Search by email, company, or name</label>
        <input type="text" id="search" placeholder="Start typing to filter..." />
      </div>
      <div class="field" style="margin-bottom:0;">
        <label for="batchFilter">Campaign</label>
        <select id="batchFilter">
          <option value="">All</option>
        </select>
      </div>
      <div class="actions" style="margin-top:0;">
        <a class="btn-ghost" href="/api/history/export.csv" style="text-decoration:none;display:inline-block;">Export CSV</a>
      </div>
    </div>
    <div id="tableWrap" style="margin-top:16px;"></div>
  </div>
</div>

<script>
function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function renderStats(stats) {
  const cards = [
    { num: stats.totalSent, label: 'Sent' },
    { num: stats.totalOpened, label: 'Opened' },
    { num: stats.totalClicked, label: 'Clicked' },
    { num: stats.totalReplied, label: 'Replied' },
    { num: stats.totalBounced, label: 'Bounced' },
    { num: stats.totalFailed, label: 'Failed' }
  ];
  document.getElementById('statsGrid').innerHTML = cards.map(c =>
    `<div class="stat-card"><div class="num">${c.num}</div><div class="label">${c.label}</div></div>`
  ).join('');

  const rates = [
    { num: stats.openRate + '%', label: 'Open rate' },
    { num: stats.clickRate + '%', label: 'Click rate' },
    { num: stats.replyRate + '%', label: 'Reply rate' },
    { num: stats.bounceRate + '%', label: 'Bounce rate' },
    { num: stats.thisWeek, label: 'Sent this week' }
  ];
  document.getElementById('rateGrid').innerHTML = rates.map(c =>
    `<div class="stat-card"><div class="num">${c.num}</div><div class="label">${c.label}</div></div>`
  ).join('');
}

function statusPill(e) {
  if (e.status === 'replied') return '<span class="pill sent" style="border-color:var(--teal);color:var(--teal-dark);font-weight:600;">replied</span>';
  if (e.status === 'bounced') return '<span class="pill failed">bounced</span>';
  if (e.status === 'failed') return '<span class="pill failed">failed</span>';
  if (e.openedAt) return '<span class="pill sent">opened' + (e.openCount > 1 ? ' ×' + e.openCount : '') + '</span>';
  return '<span class="pill" style="border-color:var(--line);color:var(--ink-soft);">sent</span>';
}

function renderTable(entries) {
  const wrap = document.getElementById('tableWrap');
  if (!entries.length) {
    wrap.innerHTML = '<div class="empty-state">No emails sent yet.</div>';
    return;
  }
  const rows = entries.map(e => `
    <tr data-id="${e.id}">
      <td class="muted">${formatDate(e.date)}</td>
      <td class="cell-company">${escapeHtml(e.company) || '<span class="muted">—</span>'}</td>
      <td class="cell-contact">${escapeHtml(e.contactName) || '<span class="muted">—</span>'}</td>
      <td class="cell-to">${escapeHtml(e.to)}</td>
      <td>${statusPill(e)}</td>
      <td class="muted">${e.clickCount || 0}</td>
      <td style="white-space:nowrap;">
        <button class="btn-ghost editBtn" type="button" style="padding:4px 10px;font-size:12px;">Edit</button>
        <button class="btn-danger deleteBtn" type="button" style="padding:4px 10px;font-size:12px;">Delete</button>
      </td>
    </tr>
  `).join('');
  wrap.innerHTML = `
    <table class="history">
      <thead><tr><th>Date</th><th>Company</th><th>Contact</th><th>Sent to</th><th>Status</th><th>Clicks</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  wrap.querySelectorAll('.deleteBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const tr = btn.closest('tr');
      if (!confirm('Delete this entry?')) return;
      await fetch('/api/history/' + tr.dataset.id, { method: 'DELETE' });
      load(document.getElementById('search').value.trim());
    });
  });
  wrap.querySelectorAll('.editBtn').forEach(btn => {
    btn.addEventListener('click', () => startEdit(btn.closest('tr')));
  });
}

function startEdit(tr) {
  const id = tr.dataset.id;
  const companyCell = tr.querySelector('.cell-company');
  const contactCell = tr.querySelector('.cell-contact');
  const toCell = tr.querySelector('.cell-to');
  const actionsCell = tr.lastElementChild;

  const cur = c => (c.textContent.trim() === '—' ? '' : c.textContent.trim());
  const currentCompany = cur(companyCell), currentContact = cur(contactCell), currentTo = toCell.textContent.trim();

  companyCell.innerHTML = `<input type="text" class="editCompany" value="${currentCompany.replace(/"/g,'&quot;')}" style="width:100%;padding:6px 8px;font-size:13px;" />`;
  contactCell.innerHTML = `<input type="text" class="editContact" value="${currentContact.replace(/"/g,'&quot;')}" style="width:100%;padding:6px 8px;font-size:13px;" />`;
  toCell.innerHTML = `<input type="email" class="editTo" value="${currentTo.replace(/"/g,'&quot;')}" style="width:100%;padding:6px 8px;font-size:13px;" />`;
  actionsCell.innerHTML = `
    <button class="btn-primary saveEditBtn" type="button" style="padding:4px 10px;font-size:12px;">Save</button>
    <button class="btn-ghost cancelEditBtn" type="button" style="padding:4px 10px;font-size:12px;">Cancel</button>
  `;

  actionsCell.querySelector('.cancelEditBtn').addEventListener('click', () => load(document.getElementById('search').value.trim()));
  actionsCell.querySelector('.saveEditBtn').addEventListener('click', async () => {
    const company = tr.querySelector('.editCompany').value.trim();
    const contactName = tr.querySelector('.editContact').value.trim();
    const to = tr.querySelector('.editTo').value.trim();
    await fetch('/api/history/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company, contactName, to })
    });
    load(document.getElementById('search').value.trim());
  });
}

async function load(search) {
  const batch = document.getElementById('batchFilter').value;
  const params = new URLSearchParams();
  if (search) params.set('search', search);
  if (batch) params.set('batch', batch);
  const res = await fetch('/api/history' + (params.toString() ? '?' + params.toString() : ''));
  const data = await res.json();
  renderStats(data.stats);
  renderTable(data.entries);
}

function formatBatchDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

async function loadBatches() {
  const res = await fetch('/api/history/batches');
  const data = await res.json();
  const panel = document.getElementById('batchesPanel');
  const wrap = document.getElementById('batchesWrap');
  const filterSelect = document.getElementById('batchFilter');

  if (!data.batches.length) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = 'block';

  wrap.innerHTML = `
    <table class="history">
      <thead><tr><th>Campaign</th><th>Sent</th><th>Open rate</th><th>Click rate</th><th>Bounce rate</th><th>Last sent</th></tr></thead>
      <tbody>
        ${data.batches.map(b => `
          <tr>
            <td>${escapeHtml(b.batchLabel)}</td>
            <td>${b.totalSent}</td>
            <td>${b.openRate}%</td>
            <td>${b.clickRate}%</td>
            <td>${b.bounceRate}%</td>
            <td class="muted">${formatBatchDate(b.lastSent)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  const currentValue = filterSelect.value;
  filterSelect.innerHTML = '<option value="">All</option>' +
    data.batches.map(b => `<option value="${escapeHtml(b.batchLabel)}">${escapeHtml(b.batchLabel)}</option>`).join('');
  filterSelect.value = currentValue;
}

let debounceTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => load(e.target.value.trim()), 200);
});
document.getElementById('batchFilter').addEventListener('change', () => {
  load(document.getElementById('search').value.trim());
});

document.getElementById('logoutLink').addEventListener('click', async e => {
  e.preventDefault();
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login.html';
});

loadBatches();
load();
</script>
</body>
</html>
